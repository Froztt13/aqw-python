<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AQW Solo Bot</title>
    <link rel="stylesheet" href="/temple/style.css">
    <link rel="stylesheet" href="/cfg.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <script src="/components.js"></script>
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <div class="brand">
                <div class="brand-text">
                    <div class="title-row">
                        <h1>AQW Solo Bot</h1>
                        <span class="version-badge">multi-account</span>
                    </div>
                    <p>Each tab is one account. Start several in parallel.</p>
                </div>
            </div>
            <div class="header-controls">
                <span id="msg" class="cfg-msg"></span>
                <button class="btn btn-secondary" id="btn-add">+ Account</button>
                <button class="btn btn-success" id="btn-start">START ALL</button>
                <button class="btn btn-danger" id="btn-stop">STOP ALL</button>
            </div>
        </header>

        <div class="aqw-tabs" id="account-tabs"></div>

        <main class="app-body">
            <div class="slot-card">
                <div class="slot-header" style="display:flex;justify-content:space-between;align-items:center">
                    <div class="slot-title-group" style="display:flex;align-items:center;gap:10px">
                        <div class="slot-icon-box" style="display:flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:8px;background:rgba(168,85,247,.15);border:1px solid rgba(168,85,247,.3)">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:14px;height:14px;color:#c084fc"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                        </div>
                        <div style="display:flex;flex-direction:column">
                            <span id="editor-title" style="font-size:.88rem;font-weight:700;line-height:1.2">Account 1</span>
                            <span id="editor-sub" style="font-size:.68rem;color:var(--text-secondary,#94a3b8);font-weight:500">not running</span>
                        </div>
                    </div>
                    <div style="display:flex;align-items:center;gap:8px">
                        <div class="status-badge" id="editor-badge">Offline</div>
                        <button class="btn btn-success btn-small" id="btn-account-toggle">START</button>
                    </div>
                </div>
                <div class="slot-body">
                    <div class="slot-grid">
                        <div class="full"><label>Player</label><select id="f-player"></select></div>
                        <div><label>Username</label><input id="f-user" type="text" autocomplete="off" placeholder="Username"></div>
                        <div><label>Password</label><div class="password-wrapper"><input id="f-pass" type="password" autocomplete="off" placeholder="Password"></div></div>
                        <div><label>Server</label><server-select id="f-server" value="Artix"></server-select></div>
                        <div><label>Room</label><input id="f-room" type="number" value="1"></div>
                        <div class="full"><label>Script (.py)</label>
                            <div class="script-selector-row" style="display:flex;gap:8px">
                                <input id="f-script" type="text" readonly placeholder="Browse for a bot script...">
                                <button class="btn btn-secondary btn-small" id="btn-browse" type="button" style="width:auto">Browse</button>
                            </div>
                        </div>
                        <div><label>Farm class</label><input id="f-farm" type="text" placeholder="e.g. Legion Revenant"></div>
                        <div><label>Solo class</label><input id="f-solo" type="text" placeholder="e.g. Void Highlord"></div>
                        <div class="full"><label>Whitelist (comma separated)</label><input id="f-whitelist" type="text"></div>
                    </div>
                    <div class="slot-status" id="editor-status" style="margin-top:10px"><span class="pill">idle</span></div>
                    <label class="chk-label" style="display:flex;align-items:center;gap:8px;margin-top:10px;cursor:pointer;padding:7px 10px;border-radius:8px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06)">
                        <input type="checkbox" id="chk-items" style="accent-color:var(--primary-color,#a855f7);cursor:pointer">
                        <span style="font-size:.8rem;color:#e2e8f0">Show item, bank, temp item</span>
                    </label>
                </div>
            </div>

            <div class="slot-card" id="items-card" style="display:none">
                <div class="slot-header" style="display:flex;justify-content:space-between;align-items:center">
                    <span style="font-weight:700">Items</span>
                    <span id="items-owner" style="font-size:.72rem;color:var(--text-muted,#64748B)"></span>
                </div>
                <div class="slot-body">
                    <div class="items-tabs" id="items-tabs">
                        <button class="items-tab active" data-list="inventory">Inventory</button>
                        <button class="items-tab" data-list="bank">Bank</button>
                        <button class="items-tab" data-list="temp">Temp item</button>
                    </div>
                    <div class="items-groups" id="items-groups"><p class="cfg-empty">No items.</p></div>
                </div>
            </div>
        </main>

        <footer class="app-console">
            <div class="console-tabs-bar">
                <div class="tabs-list"><button class="console-tab active">Log</button></div>
                <div class="console-actions">
                    <div class="console-checkbox-wrapper">
                        <input type="checkbox" id="chk-auto-scroll" checked>
                        <label for="chk-auto-scroll">Auto-Scroll</label>
                    </div>
                    <button class="btn btn-small btn-secondary" id="btn-clear-logs">Clear Logs</button>
                </div>
            </div>
            <div style="display:flex;flex:1;min-height:0;">
                <div class="console-viewport" id="log"></div>
            </div>
        </footer>
    </div>

    <script src="/players_dropdown.js"></script>
    <script src="main.js"></script>
</body>
</html>
