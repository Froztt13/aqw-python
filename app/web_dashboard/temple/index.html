<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maid Temple</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <script src="../components.js"></script>
    <script src="/players_dropdown.js"></script>
</head>
<body>
    <div class="app-container">
        
        <!-- Header Bar -->
        <header class="app-header">
            <div class="brand">
                <div class="brand-logo-wrapper">
                    <img src="app_icon.png" class="brand-logo" alt="Astolfo Logo" style="width: 36px; height: 36px; object-fit: contain; filter: drop-shadow(0 0 6px rgba(168, 85, 247, 0.4));">
                </div>
                <div class="brand-text">
                    <div class="title-row">
                        <h1 id="app-title-click">Maid Temple</h1>
                        <span class="version-badge">v1.1.0</span>
                        <div class="app-sys-stats" id="app-sys-stats" style="display: flex; gap: 8px; font-size: 0.7rem; font-family: 'Fira Code', monospace; color: var(--text-secondary); align-items: center; margin-left: 8px;">
                            <span class="stat-item"><span style="color: var(--primary-color); font-weight: bold;">CPU:</span> <span id="sys-cpu">0.0%</span></span>
                            <span class="stat-item"><span style="color: var(--primary-color); font-weight: bold;">MEM:</span> <span id="sys-mem">0.0 MB</span></span>
                        </div>
                    </div>
                    <p>Temple Shrine Dungeon Manager</p>
                    <div class="info-tooltip-bubble" id="info-bubble">
                        Based on <strong>AQW Python</strong><br>
                        <a href="https://github.com/Froztt13/aqw-python" target="_blank" style="color: var(--primary-color); text-decoration: underline;">GitHub Repository</a>
                    </div>
                </div>
            </div>
            <div class="header-controls">
                <div class="global-config-group">
                    <div class="input-inline">
                        <label for="select-server">Server</label>
                        <server-select id="select-server" value="Alteon"></server-select>
                    </div>
                    <div class="input-inline">
                        <label for="input-room-number">Room</label>
                        <input type="number" id="input-room-number" value="9099">
                    </div>
                    <div class="input-inline">
                        <label for="select-temple-bot">Bot</label>
                        <select id="select-temple-bot">
                            <option value="MidnightSunBot">Midnight Sun</option>
                            <option value="SolsticeMoonBot">Solstice Moon</option>
                        </select>
                    </div>
                </div>
                
                <duration-counter id="duration-counter" val-id="duration-val"></duration-counter>
                <cleared-counter id="cleared-counter" val-id="cleared-val"></cleared-counter>
                <settings-button id="btn-toggle-settings" title="General Settings"></settings-button>
                <bot-control-buttons start-id="btn-start-party" stop-id="btn-stop-party" start-label="START" stop-label="STOP"></bot-control-buttons>
            </div>
        </header>

        <!-- Settings Dropdown Panel -->
        <div class="settings-dropdown-panel hidden" id="settings-dropdown-panel">
            <div class="settings-panel-header">General Settings</div>
            <div class="settings-panel-body">
                <div class="form-group-checkbox">
                    <label class="chk-label" style="display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 0.75rem; color: #e5e7eb;">
                        <input type="checkbox" id="chk-auto-restart" style="cursor: pointer;">
                        Enable Auto-Restart on DC
                    </label>
                </div>
                <div class="form-group-inline">
                    <span>Delay (seconds)</span>
                    <input type="number" id="input-restart-delay" min="5" value="30" style="width: 70px;">
                </div>
                <div class="form-group-inline">
                    <span>Max Attempts</span>
                    <input type="number" id="input-restart-max-attempts" min="1" max="10" value="3" style="width: 70px;">
                </div>
                <div class="restart-status-indicator" id="restart-status-indicator" style="font-size: 0.7rem; color: var(--primary-color); font-weight: bold; text-align: center; margin-top: 4px;"></div>
                
                <div class="settings-actions-row" style="display: flex; gap: 8px; margin-top: 8px; border-top: 1px solid rgba(255, 255, 255, 0.05); padding-top: 8px;">
                    <button class="btn btn-secondary flex-1" id="btn-toggle-censor" title="Toggle Censor Mode" style="font-size: 0.72rem; padding: 6px 4px; display: flex; align-items: center; justify-content: center; gap: 4px; height: 32px;">
                        <svg id="censor-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width: 12px; height: 12px; pointer-events: none;"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                        Censor Mode
                    </button>
                    <button class="btn btn-secondary flex-1" id="btn-reset-config" title="Reset Configuration" style="font-size: 0.72rem; padding: 6px 4px; display: flex; align-items: center; justify-content: center; gap: 4px; height: 32px;">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width: 12px; height: 12px; pointer-events: none;">
                            <path d="M23 4v6h-6"></path>
                            <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
                        </svg>
                        Reset Config
                    </button>
                </div>
            </div>
        </div>

        <!-- Main Workspace -->
        <main class="app-body">
            <!-- Monsters HP Panel -->
            <div class="monsters-panel hidden" id="monsters-panel">
                <div class="monsters-panel-title">Monsters HP</div>
                <div class="monsters-list" id="monsters-list"></div>
            </div>
            <div class="slots-grid">
                <!-- Reusable Slot 1 & Slot 2 -->
                <item-slot-card slot-id="slot1" feature="temple" theme="sun-theme" title="Master" class-placeholder="ArchPaladin"></item-slot-card>
                <item-slot-card slot-id="slot2" feature="temple" theme="moon-theme" title="Slave 1" class-placeholder="StoneCrusher"></item-slot-card>
                <!-- Reusable Slot 3 & Slot 4 -->
                <item-slot-card slot-id="slot3" feature="temple" theme="moon-theme" title="Slave 2" class-placeholder="Lord of Order"></item-slot-card>
                <item-slot-card slot-id="slot4" feature="temple" theme="moon-theme" title="Slave 3" class-placeholder="Lord of Order"></item-slot-card>
            </div>
        </main>

        <!-- Bottom Console Bar -->
        <footer class="app-console">
            <div class="console-tabs-bar">
                <div class="tabs-list" id="console-tabs-list">
                    <button class="console-tab active" data-source="System">System</button>
                </div>
                <div class="console-actions">
                    <div class="console-checkbox-wrapper">
                        <input type="checkbox" id="chk-auto-scroll" checked>
                        <label for="chk-auto-scroll">Auto-Scroll</label>
                    </div>
                    <button class="btn btn-small btn-secondary" id="btn-clear-logs">Clear Logs</button>
                </div>
            </div>
            <div style="display: flex; flex: 1; min-height: 0;">
                <div class="console-viewport" id="console-viewport">
                    <!-- Log streams appear here -->
                </div>
            </div>
        </footer>

    </div>
    
    <script src="../components.js"></script>
    <script src="main.js"></script>
</body>
</html>
